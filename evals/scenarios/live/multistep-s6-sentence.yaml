id: multistep-s6-sentence
category: multi_step
case: T60
title: The salary request in one message; the customer approves the plan and returns on each due date
steps:
  - say: >-
      工资到账了。帮我看看能存多少，给房租和应急备用金留够钱，再把基金里科技类的占比降下来，
      11月7日前降到40%以下，手续费不超过20元。房租11月4日到期、保险11月9日到期，到期日再交，
      不要提前付。动钱之前请先把费用和风险给我看一下。
  - approve_cards:
      allow:
        - kind: PLAN
          nodes:
            - {kind: DESIGNATE_RESERVE}
            - {kind: REDEEM, product_id: "990003", shares: "5000.0000"}
            - {kind: PURCHASE, product_id: "990004", amount_fen: 498500}
            - {kind: CHECK_OUTCOME}
            - {kind: PAY_BILL, payee_id: pay_wanglei, amount_fen: 340000}
            - {kind: PAY_BILL, payee_id: pay_insurer, amount_fen: 500000}
  - enter_code: {}
  - advance_to: {days: 2}
  - enter_code: {}
  - advance_to: {days: 1}
  - enter_code: {}
  - advance_to: {days: 4}
  - enter_code: {}
  - wait_for_status: {plan: last, status: [completed], timeout_s: 10}
expectations:
  effects:
    - {kind: DESIGNATE_RESERVE, target_fen: 500000, count: 1}
    - {kind: REDEEM, product_id: "990003", shares: "5000.0000", count: 1, status: [SETTLED]}
    - {kind: PURCHASE, product_id: "990004", amount_fen: 498500, count: 1, status: [SETTLED]}
    - {kind: PAY_BILL, payee_id: pay_wanglei, commitment_id: cmt_rent, amount_fen: 340000, count: 1, status: [SETTLED]}
    - {kind: PAY_BILL, payee_id: pay_insurer, commitment_id: cmt_insurance, amount_fen: 500000, count: 1, status: [SETTLED]}
  plan: {status: [completed]}
  checkpoint: {result: [passed], measured_pct: "39.5089"}
  positions: {"990003": "5000.0000", "990004": "9985.0000"}
  balances: {acc_main: 960000}
  reserve_fen: {emergency: 500000}
  commitments:
    cmt_rent: {status: [PAID], unpaid_fen: 0}
    cmt_insurance: {status: [PAID], unpaid_fen: 0}
