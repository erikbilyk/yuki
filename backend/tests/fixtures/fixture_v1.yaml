  - {id: pay_dad, customer: cus_main, alias: "爸爸", display_name: "爸爸", bank: other, account_masked: "··5678", account_ref: "SIM-0002-5678"}
  - {id: pay_wanglei, customer: cus_main, alias: "王磊", display_name: "王磊", bank: same, account_masked: "··3344", account_ref: "SIM-0003-3344"}
  - {id: pay_wangfang, customer: cus_main, alias: "王芳", display_name: "王芳", bank: same, account_masked: "··5566", account_ref: "SIM-0004-5566"}
  - {id: pay_insurer, customer: cus_main, alias: "保险公司", display_name: "模拟人寿保险", bank: same, account_masked: "··7788", account_ref: "SIM-0005-7788"}
