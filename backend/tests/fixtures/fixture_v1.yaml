# fixture_v1: base profile of the simulator.
# Money is integer fen (credits positive, debits negative in statements).
# Shares, NAV, weights and rates are strings. Dates that move with the epoch
# are offsets in days from it; other dates are calendar dates (Asia/Shanghai).
# Variant paths address list elements by their id (source_txn_id for transactions).
profile: fixture_v1
epoch: "2026-11-02T09:00:00+08:00"

customers:
  - {id: cus_main, handle: demo-main, password: wg-demo-main-2026, display_name: "周宁"}
  - {id: cus_other, handle: demo-other, password: wg-demo-other-2026, display_name: "赵一"}

# role: operator (wg_operator cookie) or demo (wg_demo cookie).
operators:
  - {id: opr_ops, handle: demo-ops, password: wg-demo-ops-2026, role: operator}
  - {id: opr_demo, handle: demo-panel, password: wg-demo-panel-2026, role: demo}

# opening_fen is the posted balance at the epoch (the loader's OPENING operation).
accounts:
  - {id: acc_main, customer: cus_main, name: "主账户", covered: true, opening_fen: 1800000}
  - {id: acc_savings, customer: cus_main, name: "储蓄账户", covered: true, opening_fen: 0}
  - {id: acc_other, customer: cus_other, name: "主账户", covered: true, opening_fen: 500000}

# bank: same is shown as 本行, other as 他行; account_masked holds the last four digits.
