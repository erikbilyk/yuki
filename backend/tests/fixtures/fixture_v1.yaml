# rent: a regular payment excluded from the daily allowance, so it must point at an active commitment.
commitments:
  - {id: cmt_rent, customer: cus_main, purpose_id: pur_rent, kind: rent, payee: pay_wanglei, amount_fen: 340000, unpaid_fen: 340000, due_offset_days: 2, recurrence: monthly, source: trusted_ebill, status: CONFIRMED}
  - {id: cmt_insurance, customer: cus_main, purpose_id: pur_insurance, kind: insurance, payee: pay_insurer, amount_fen: 500000, unpaid_fen: 500000, due_offset_days: 7, recurrence: none, source: trusted_ebill, status: CONFIRMED}

reserve: {target_fen: 400000}

# budget_fen is the amount spent so far this month (60000) plus remaining_fen.
allowance:
  period: "2026-11"
  budget_fen: 360000
  remaining_fen: 300000
  excluded_purpose_ids: [pur_rent]

margin_fen: 60000
income_this_month_fen: 1200000
spent_this_month_fen: 60000

# Fund codes are strings. All four share class C; NAV is constant in the base profile.
products:
  - {id: "990001", name: "基金A", share_class: C, nav: "1.0000", nav_date_offset_days: 0, fee_schedule: fee_flat_v1, min_purchase_fen: 10000, redeem_settle_days: 3, purchase_settle_days: 0}
  - {id: "990002", name: "基金B", share_class: C, nav: "1.0000", nav_date_offset_days: 0, fee_schedule: fee_flat_v1, min_purchase_fen: 10000, redeem_settle_days: 3, purchase_settle_days: 0}
  - {id: "990003", name: "基金C", share_class: C, nav: "1.0000", nav_date_offset_days: 0, fee_schedule: fee_flat_v1, min_purchase_fen: 10000, redeem_settle_days: 3, purchase_settle_days: 0}
  - {id: "990004", name: "基金D", share_class: C, nav: "1.0000", nav_date_offset_days: 0, fee_schedule: fee_flat_v1, min_purchase_fen: 10000, redeem_settle_days: 3, purchase_settle_days: 0}

# Rates are fractions (0.0030 is 0.3%). Tier bounds are whole days held, inclusive;
# the public tiers apply to 0 < N days, so the first tier starts at 1. purchase_rate applies to purchases.
fee_schedules:
  - id: fee_flat_v1
    terms_version: synthetic_0.3pct_v1
    purchase_rate: "0.0000"
    tiers:
      - {min_days: 1, max_days: null, rate: "0.0030"}
  - id: fee_public_c_v1
    terms_version: public_c_share_v1
    purchase_rate: "0.0000"
    tiers:
      - {min_days: 1, max_days: 6, rate: "0.0150"}
      - {min_days: 7, max_days: 29, rate: "0.0050"}
      - {min_days: 30, max_days: null, rate: "0.0000"}

positions:
  - {account: acc_main, product: "990001", shares: "20000.0000"}
  - {account: acc_main, product: "990002", shares: "15000.0000"}
  - {account: acc_main, product: "990003", shares: "10000.0000"}
  - {account: acc_main, product: "990004", shares: "5000.0000"}

# One lot per fund, acquired 60 days before the epoch, cost at NAV 1.0000.
lots:
  - {id: lot_a1, product: "990001", shares: "20000.0000", acquired_offset_days: -60, cost_fen: 2000000}
  - {id: lot_b1, product: "990002", shares: "15000.0000", acquired_offset_days: -60, cost_fen: 1500000}
  - {id: lot_c1, product: "990003", shares: "10000.0000", acquired_offset_days: -60, cost_fen: 1000000}
  - {id: lot_d1, product: "990004", shares: "5000.0000", acquired_offset_days: -60, cost_fen: 500000}

