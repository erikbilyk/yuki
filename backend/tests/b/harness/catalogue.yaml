# Acceptance case catalogue (docs: ACCEPTANCE §2 and §4).
#
# gate:        earliest gate that requires the case (G1 < G2 < G3 < G4; GS5 is the S5 gate);
#              null means reported but not gating.
# layers:      layers required for `passed`. D, H, K and S run under pytest; U (browser)
#              and L (live model) run elsewhere and are reported as external.
# layer_gates: per-layer override of `gate` (for example the S variant of T7 gates at G2).
# applicable:  always | never | feature:<name>, where <name> must appear in the
#              `features` list of GET /healthz.
# reason:      why a case is not applicable (required for `never`), or a short note such as
#              why a case is not built.

gates: [G1, G2, G3, G4]
sets:
  S1: {title: "S1 transfers and core", release: required}
  S2: {title: "S2 cash and bills", release: required}
  S3: {title: "S3 funds", release: required}
  S6: {title: "S6 cross-scenario plan", release: required}
  S4: {title: "S4 cards", release: unscheduled}
  S5: {title: "S5 direct debits", release: conditional}
  R: {title: "Regressions", release: required}

