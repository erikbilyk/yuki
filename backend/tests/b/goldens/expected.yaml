# Purchase revision decisions. x_fen is the cumulative confirmed bill increase,
# headroom_fen the headroom at the T+3 settlement after that increase.
revision_sequence:
  bounds: {p0_fen: 498500, spare0_fen: 100000, max_added_fen: 120000, max_retained_fen: 20000, min_purchase_fen: 478500}
  steps:
    - {event: bill_800, x_fen: 80000, current_fen: 498500, headroom_fen: 518500, decision: unchanged, purchase_fen: 498500, reasons: []}
    - {event: bill_400, x_fen: 120000, current_fen: 498500, headroom_fen: 478500, decision: revise, purchase_fen: 478500, reasons: []}
    - {event: bill_400_again, x_fen: 160000, current_fen: 478500, headroom_fen: 438500, decision: pause, purchase_fen: 438500, reasons: [BILL_INCREASE_OVER_LIMIT, RETENTION_OVER_LIMIT, PURCHASE_BELOW_MIN]}
  # The same events delivered again leave the decision unchanged.
  repeats:
    - {event: bill_800, x_fen: 80000, current_fen: 498500, headroom_fen: 518500, decision: unchanged, purchase_fen: 498500}
    - {event: bill_400, x_fen: 120000, current_fen: 478500, headroom_fen: 478500, decision: unchanged, purchase_fen: 478500}
  rejected_sketch_purchase_fen: 458500

